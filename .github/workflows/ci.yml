name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      # --exit-zero: ruff reports, it does not gate.  The repository carries 84
      # findings that predate this workflow, and the standing decision is to
      # leave them rather than sweep them (the count is tracked in
      # docs/代码审计报告.md, and it may only shrink).  Without this flag the
      # first push is red on a known-and-accepted state, which trains everyone
      # to ignore the build.  The findings are still printed in full, so a new
      # one is visible -- it just does not fail the step.
      - run: ruff check src tests examples --exit-zero
      - run: python scripts/check_no_reference_imports.py
      - run: lint-imports
      - run: pytest -q
