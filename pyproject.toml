[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrainer"
version = "0.1.0"
description = "A model-agnostic PyTorch training foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.scripts]
aitrainer = "aitrainer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["aitrainer"]

# Layers are listed HIGHEST FIRST: a layer may import the layers below it and
# modules on its own line, but never the ones above.
#
# `ignore_imports` is a migration ratchet, not an escape hatch: every entry is
# an edge a later stage of the decoupling refactor removes, and the entry is
# deleted in the same commit that removes the edge. The list may only shrink.
[[tool.importlinter.contracts]]
name = "aiTrainer layers"
type = "layers"
layers = [
    # L5 — public surface. Nothing imports these except the package root.
    "aitrainer.api | aitrainer.cli",
    # L4 — orchestration. Owns the ordering of everything below.
    # Non-independent (`:`): trainer reaches parallelizer for lazy parallelize().
    "aitrainer.trainer : aitrainer.parallelizer : aitrainer.diagnostics : aitrainer.loading : aitrainer.model_spec",
    # L3 — strategies built on the platform. These three do not import each other.
    "aitrainer.offload | aitrainer.plugins | aitrainer.planner",
    # L2 — the platform: process groups, collectives, PP, checkpoint I/O, async substrate.
    # Non-independent: mesh is built on parallel.groups, and the async substrate
    # in overlap/ is used by offload/ and by collectives via lifecycle.
    "aitrainer.parallel : aitrainer.mesh : aitrainer.checkpoint : aitrainer.overlap : aitrainer.memory : aitrainer.runtime : aitrainer.distributed_model",
    # L1 — declarations: config, contracts, capability registry, hardware description.
    # Non-independent: capability/presets/precision build on config.
    "aitrainer.config : aitrainer.capability : aitrainer.precision : aitrainer.data : aitrainer.topology : aitrainer.presets : aitrainer.metrics : aitrainer.profiler : aitrainer.kernels : aitrainer.lifecycle : aitrainer.adapters",
]
ignore_imports = [
    # `data` needs `split_microbatches` from the parallel layer. Both this edge
    # and the reciprocal `parallel.pp_schedule -> data` are resolved by moving
    # the batch conventions into `aitrainer.core.batching` (refactor Stage 3).
    "aitrainer.data -> aitrainer.parallel.pp_shapes",
]
