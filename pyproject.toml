[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrainer"
version = "0.1.0"
description = "A model-agnostic PyTorch training foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.scripts]
aitrainer = "aitrainer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
