[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrainer"
version = "0.1.0"
description = "A model-agnostic PyTorch training foundation"
readme = "README.md"
requires-python = ">=3.10"
# torch and nothing else, deliberately: src/aitrainer contains no import of any
# other third-party package.  See the `dev` extra for what the test suite needs
# on top of that.
dependencies = ["torch>=2.1"]

[project.scripts]
aitrainer = "aitrainer.cli:main"

[project.optional-dependencies]
# numpy is TEST-only, and it is not optional in practice: torch does not depend
# on it, and `torch.distributed.all_gather_object` reaches for `.numpy()`
# internally, so every worker case that gathers a Python object dies without it.
# Measured on a clean CI install: 35 of 270 tests failed with
# "RuntimeError: Numpy is not available", raised from
# distributed_c10d.py's `tensor.numpy().tobytes()`.  It went unnoticed because
# the development host happens to have numpy installed for unrelated reasons.
# It stays out of `dependencies` because src/ never touches it -- the framework
# itself is torch-only, and that is a property worth keeping.
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "import-linter>=2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["aitrainer"]

# Layers are listed HIGHEST FIRST: a layer may import the layers below it and
# modules on its own line, but never the ones above.
#
# `ignore_imports` is a migration ratchet, not an escape hatch: every entry is
# an edge a later stage of the decoupling refactor removes, and the entry is
# deleted in the same commit that removes the edge. The list may only shrink.
[[tool.importlinter.contracts]]
name = "aiTrainer layers"
type = "layers"
layers = [
    # L5 — public surface. Nothing imports these except the package root.
    "aitrainer.api | aitrainer.cli",
    # L4 — orchestration. Owns the ordering of everything below.
    # Non-independent (`:`): trainer reaches parallelizer for lazy parallelize().
    "aitrainer.trainer : aitrainer.parallelizer : aitrainer.diagnostics : aitrainer.loading",
    # L3 — strategies built on the platform. These three do not import each other.
    "aitrainer.offload | aitrainer.plugins | aitrainer.planner",
    # L2 — the platform: process groups, collectives, PP, checkpoint I/O, async substrate.
    # Non-independent: mesh is built on parallel.groups, and the async substrate
    # in overlap/ is used by offload/ and by collectives via lifecycle.
    "aitrainer.parallel : aitrainer.mesh : aitrainer.checkpoint : aitrainer.overlap : aitrainer.memory : aitrainer.runtime : aitrainer.distributed_model",
    # L1 — declarations: config, contracts, capability registry, hardware description.
    # Non-independent: capability/presets/precision build on config.
    "aitrainer.config : aitrainer.capability : aitrainer.precision : aitrainer.data : aitrainer.topology : aitrainer.presets : aitrainer.metrics : aitrainer.profiler : aitrainer.kernels : aitrainer.adapters",
    # L0 — the leaf layer. Nothing here imports anything else in aitrainer.
    "aitrainer.core",
]

# Empty, and it stays that way: the one entry it used to carry --
# `aitrainer.data -> aitrainer.parallel.pp_shapes` -- was removed by moving the
# batch conventions into aitrainer.core.batching.  New violations are fixed, not
# added here.
ignore_imports = []

[[tool.importlinter.contracts]]
name = "core is a leaf"
type = "forbidden"
source_modules = ["aitrainer.core"]
forbidden_modules = [
    "aitrainer.adapters", "aitrainer.api", "aitrainer.capability", "aitrainer.checkpoint",
    "aitrainer.cli", "aitrainer.config", "aitrainer.data", "aitrainer.diagnostics",
    "aitrainer.distributed_model", "aitrainer.kernels", "aitrainer.loading", "aitrainer.memory",
    "aitrainer.mesh", "aitrainer.metrics", "aitrainer.offload", "aitrainer.overlap",
    "aitrainer.parallel", "aitrainer.parallelizer", "aitrainer.planner", "aitrainer.plugins",
    "aitrainer.precision", "aitrainer.presets", "aitrainer.profiler", "aitrainer.runtime",
    "aitrainer.topology", "aitrainer.trainer",
]

[[tool.importlinter.contracts]]
name = "plugins reach parallel only through the model-integration surface"
type = "forbidden"
# Direct imports only.  `parallel.tp` is allowed and itself imports
# `parallel.collectives`, so a transitive check would forbid an edge that
# plugins neither write nor can avoid.
allow_indirect_imports = true
source_modules = ["aitrainer.plugins"]
forbidden_modules = [
    "aitrainer.parallel.fsdp", "aitrainer.parallel.groups", "aitrainer.parallel.pp_p2p",
    "aitrainer.parallel.pp_schedule", "aitrainer.parallel.sp_sequence",
    "aitrainer.parallel.sp_ulysses",
]
